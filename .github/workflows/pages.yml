name: Deploy to GitHub Pages

# Static build of melon-seek (no server) published to
# https://alvations.github.io/melon-seek/ . The daily run refreshes the bundled
# snapshots from the live boards (GitHub runners can reach them).
#
# One-time repo setup: Settings -> Pages -> Source: "GitHub Actions".
# To deploy from a non-default branch, also allow it under
# Settings -> Environments -> github-pages -> Deployment branches and tags.
on:
  push:
    branches: [main, claude/stoic-ride-54ddxp]
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *" # daily, 07:41 UTC (after snapshot.yml's 06:17 run)

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh snapshots (best effort; committed snapshots are used if this fails)
        run: npm run snapshot || true # no args = every built-in in server/companies.js

      - name: Build static site
        run: npm run build

      - name: Summarize bundle
        run: |
          {
            echo "### Bundled data"
            echo ""
            echo "| company | mode | jobs | list | descriptions | fetchedAt |"
            echo "| --- | --- | --- | --- | --- | --- |"
            for f in dist/api/jobs/*.json; do
              slug=$(basename "$f" .json)
              list_kb=$(( $(stat -c %s "$f") / 1024 ))
              desc_n=$(find "dist/api/desc/$slug" -type f 2>/dev/null | wc -l)
              desc_kb=$(( $(du -sb "dist/api/desc/$slug" 2>/dev/null | cut -f1 || echo 0) / 1024 ))
              jq -r --arg l "$list_kb" --arg n "$desc_n" --arg d "$desc_kb" \
                '"| \(.company.slug) | \(.mode) | \(.jobs | length) | \($l) KB | \($n) files, \($d) KB | \(.fetchedAt) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true # keep dist/.nojekyll (v4+ drops dotfiles by default)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
