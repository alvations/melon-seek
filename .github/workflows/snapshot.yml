name: Snapshot job boards

# GitHub-hosted runners can reach the public job-board APIs, so this workflow
# is how real data lands in data/snapshots/ (the offline fallback before demo).
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch snapshots
        run: npm run snapshot -- anthropic anduril openai

      - name: Commit changed snapshots
        run: |
          set -euo pipefail
          git add -A data/snapshots/*.json || true
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh job board snapshots ($(date -u +%Y-%m-%d))"
          git push
