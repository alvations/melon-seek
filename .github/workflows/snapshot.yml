name: Snapshot job boards

# GitHub-hosted runners can reach the public job-board APIs. This workflow
# fetches every built-in board and uploads data/snapshots/*.json as a workflow
# ARTIFACT. It does not commit them: real snapshots are tens of MB per day
# (anduril alone is ~38 MB), which would bloat the git history. pages.yml
# restores the latest artifact as its fallback before fetching fresh data.
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch snapshots
        run: npm run snapshot # no args = every built-in in server/companies.js

      # TODO(vetting): once scripts/vet-salaries.js exists, add a step here that
      # runs `node scripts/vet-salaries.js` and fails the job on critical salary
      # anomalies, so a bad snapshot is never uploaded.

      - name: Upload snapshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: job-board-snapshots
          path: data/snapshots/*.json
          retention-days: 14
          if-no-files-found: error
