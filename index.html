<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    HOLDING PAGE. Not the app. This file only exists so GitHub's branch-based Pages build
    ("pages build and deployment", which runs on every push while Settings -> Pages -> Source is
    "Deploy from a branch") publishes this page instead of the repository README. It refreshes
    itself; the real site (scripts/build-static.js -> dist/, deployed by .github/workflows/pages.yml)
    replaces it within a minute or two. The app is never built from this file.
    Permanent fix: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
    Guarded by test/pages-holding.test.js. docs/process/lead.md "Pages: README never again".
  -->
  <meta name="melon-seek-holding" content="branch-build">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="10">
  <title>melon·seek is updating</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #1d2433; }
    @media (prefers-color-scheme: dark) { body { background: #11141a; color: #e6e9ef; } }
    main { max-width: 32rem; padding: 24px; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; opacity: .8; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>🍉 melon·seek is updating</h1>
    <p>A new version of the site is being published. This page reloads by itself in a few seconds.</p>
    <p><a href="./">Reload now</a></p>
  </main>
</body>
</html>
